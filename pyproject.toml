# setuptools>=77 emits PEP 639 `License-Expression` metadata from the `license`
# field below and includes the LICENSE file in the distributions automatically.
[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "fabricpc"
version = "0.5.1"
description = "A flexible, performant predictive coding library using JAX"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
    {name = "SingularityNET Foundation", email = "info@singularitynet.io"}
]
keywords = ["predictive-coding", "jax", "neural-networks", "machine-learning"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

# `jaxlib` is not listed: `jax` pins the matching `jaxlib`, and an unpinned
# `jaxlib` here can fight the coupled wheel set that jax[cuda12]/jax[cuda13] install.
#
# The `jax` floor is 0.7.0, the oldest release whose own Python floor is >=3.11 —
# the same floor this project declares.
dependencies = [
    "jax>=0.7.0",
    "optax>=0.1.7",
    "orbax-checkpoint>=0.4.0",
    "chex>=0.1.84",
    "jaxtyping>=0.2.23",
    "numpy>=1.24.0",
    "tqdm>=4.65.0",
]

[project.urls]
Homepage = "https://github.com/trueagi-io/FabricPC"
Repository = "https://github.com/trueagi-io/FabricPC"
Documentation = "https://github.com/trueagi-io/FabricPC/blob/main/docs/user_guides/00_index.md"
Changelog = "https://github.com/trueagi-io/FabricPC/blob/main/CHANGELOG.md"
Issues = "https://github.com/trueagi-io/FabricPC/issues"

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "hypothesis>=6.0.0",
    "black[colorama]==26.1.0",
    # Pinned to the ruff-pre-commit rev in .pre-commit-config.yaml so local
    # `ruff check` and the hook agree.
    "ruff==0.15.19",
    "mypy>=1.0.0",
    "pre-commit>=3.0.0",
    # Release tooling: `python -m build` and `twine check dist/*`.
    "build>=1.0.0",
    "twine>=5.0.0",
]
tfds = [
    "tensorflow-datasets>=4.9.0",
    # TensorFlow is used only for tf.data input pipelines; every GPU op in
    # FabricPC goes through JAX. On Linux the default `tensorflow` wheel is a
    # CUDA build that dlopens CUDA libraries by SONAME during `import
    # tensorflow` -- before the tf.config.set_visible_devices([], "GPU") calls
    # in utils/data/dataloader.py can take effect. On a machine whose loader
    # search path (LD_LIBRARY_PATH/ldconfig) carries a system CUDA 13 toolkit
    # older than JAX's pip nvidia-* wheels, that import makes the system
    # libcublas.so.13 resident first. JAX's cuda13 plugin later loads its pip
    # copy by absolute path, but glibc deduplicates by SONAME and returns the
    # older resident library; the plugin's version check fails ("Outdated
    # cuBLAS installation") and JAX silently falls back to CPU (segfaults if
    # bypassed with JAX_SKIP_CUDA_CONSTRAINTS_CHECK). Co-installed TF and JAX
    # CUDA stacks alone do not collide: distinct SONAMEs (.so.12 vs .so.13)
    # coexist in one process. tensorflow-cpu does no CUDA probing at import,
    # so it cannot preload the stale system library. tensorflow-cpu publishes
    # wheels for x86_64 Linux and Windows only, so the swap is gated to Linux
    # x86_64. macOS and aarch64 Linux keep `tensorflow` because no
    # tensorflow-cpu wheel exists there; Windows keeps it because native
    # Windows TF has been CPU-only since 2.11. The two markers are exact
    # complements: exactly one applies on every platform.
    "tensorflow-cpu>=2.15.0; platform_system == 'Linux' and platform_machine == 'x86_64'",
    "tensorflow>=2.15.0; platform_system != 'Linux' or platform_machine != 'x86_64'",

    # tfds imports the third-party importlib_resources backport unconditionally
    # in its download path (dataset_builder.py), but declares it only for
    # python_version < "3.9". Without this, the first download of any dataset
    # fails with ModuleNotFoundError on Python >= 3.9.
    "importlib_resources",
    "tokenizers>=0.15.0",
]
experiments = [
    "scipy>=1.10.0",
    # `fabricpc.tuning` (BayesianTuner) imports optuna; nothing in the core
    # library does, so it ships with the experiment tooling rather than the core.
    "optuna>=3.0.0",
]
viz = [
    "plotly>=5.0.0",
    "kaleido>=0.2.1",
    "pandas>=2.0.0",
    # Aim needs aimrocks (RocksDB), which ships no Windows wheels, and supports Python <=3.12
    # only; skipped on Windows and on 3.13 so [viz]/[all] still resolve everywhere.
    "aim>=3.0.0; python_version < '3.13' and platform_system != 'Windows'",
]
# Backend selection. Each delegates the full coupled wheel set to JAX
# (jaxlib, plugin, pjrt, nvidia-*); FabricPC pins none of those versions.
cpu = [
    "jax[cpu]",
]
cuda12 = [
    "jax[cuda12]",
]
cuda13 = [
    "jax[cuda13]",
]
# Everything a user needs except the hardware backend. Append a backend extra
# for GPU (e.g. ".[all,cuda12]"), or omit it for the CPU build from the base jax
# dependency. `dev` is deliberately excluded — `pip install "fabricpc[all]"`
# must not drop black, mypy, ruff, and pre-commit into an end user's
# environment. Contributors install ".[all,dev]".
all = [
    "fabricpc[tfds,experiments,viz]",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["fabricpc*"]

[tool.black]
line-length = 88
target-version = ["py311", "py312", "py313"]
include = '\.pyi?$'
extend-exclude = '''
/(
    \.git
    | \.venv
    | build
    | dist
)/
'''

[tool.ruff]
target-version = "py311"
extend-exclude = [".git", ".venv", "build", "dist"]

[tool.ruff.lint]
# B006 (mutable-argument-default) forbids list/dict/set literal defaults — the
# genuinely dangerous shared-mutable-state bug. It does NOT flag custom
# constructor calls such as `= GaussianEnergy()`; those stateless value-object
# defaults are the convention this package standardizes on, made
# safe-by-construction by freezing the config base classes (ActivationBase /
# EnergyFunctional / InitializerBase are immutable after construction).
#
# `extend-select` runs B006 on top of ruff's default ruleset (pyflakes F +
# pycodestyle E4/E7/E9), which the codebase is kept clean against. B008
# (function-call-in-default-argument) is intentionally NOT enabled — it would
# flag every `= GaussianEnergy()` / `= KaimingInitializer()` signature default,
# which is exactly the pattern being standardized on.
extend-select = ["B006"]
